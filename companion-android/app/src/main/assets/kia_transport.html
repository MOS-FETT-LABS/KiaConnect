<!DOCTYPE html>
<html>
<body>
<script>
// Transport worker for the Kia companion: the Android side enqueues HTTP
// tasks, this page performs them with the WebView's network stack (Chrome
// TLS fingerprint) and reports results back. Universal file access lets the
// file:// origin read cross-origin responses.
var pending = null;

function pump() {
    if (pending !== null) {
        setTimeout(pump, 100);
        return;
    }
    var task = AndroidBridge.next();
    if (!task) {
        setTimeout(pump, 100);
        return;
    }
    try {
        pending = JSON.parse(task);
        var xhr = new XMLHttpRequest();
        xhr.open(pending.method, pending.url, true);
        var headers = pending.headers || {};
        for (var key in headers) {
            if (Object.prototype.hasOwnProperty.call(headers, key)) {
                try {
                    xhr.setRequestHeader(key, headers[key]);
                } catch (e) {}
            }
        }
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) {
                return;
            }
            var result = {
                id: pending.id,
                status: xhr.status,
                text: xhr.responseText,
                headers: xhr.getAllResponseHeaders()
            };
            AndroidBridge.onResult(JSON.stringify(result));
            pending = null;
        };
        if (pending.body) {
            xhr.send(pending.body);
        } else {
            xhr.send(null);
        }
    } catch (e) {
        if (pending) {
            AndroidBridge.onResult(JSON.stringify({
                id: pending.id,
                status: 0,
                text: 'transport error: ' + e,
                headers: ''
            }));
            pending = null;
        }
    }
    setTimeout(pump, 100);
}

AndroidBridge.ready();
pump();
</script>
</body>
</html>
